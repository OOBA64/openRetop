[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openretop-workbench-ui"
version = "0.1.0"
description = "Reusable PySide6 workbench UI primitives for technical desktop applications"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[tool.setuptools]
packages = ["workbench_ui"]
