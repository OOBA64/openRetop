name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Compile
        run: python -m compileall -q src packages/workbench_ui/workbench_ui
      - name: Architecture boundaries
        run: python scripts/report_architecture_metrics.py --fail-on-new

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libxrender1 libxkbcommon-x11-0 libegl1
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Informative benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python benchmarks/benchmark_scene_sync.py --iterations 10
          python benchmarks/benchmark_v3_workflows.py --iterations 5 --curves 100
