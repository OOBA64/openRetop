name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libxrender1 libxkbcommon-x11-0

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify required desktop dependencies
        run: python -c "import PySide6; import vtkmodules"

      - name: Compile V3 source
        run: python -m compileall -q src packages/workbench_ui/workbench_ui

      - name: Verify architecture boundaries
        run: python scripts/report_architecture_metrics.py --fail-on-new

      - name: Run V3 focused suites
        env:
          PYTHONPATH: src:packages/workbench_ui
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m unittest
          tests.test_task77_viewport
          tests.test_task78_boundaries
          tests.test_task79_workbench_ui
          tests.test_task80_v3_ui
          tests.test_task81_legacy_boundary
          tests.test_task82_release
          tests.test_v3_workflow_service

      - name: Run accelerated mesh-query tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_mesh_spatial_index.py"

      - name: Run complete test suite
        env:
          PYTHONPATH: src:packages/workbench_ui
        run: xvfb-run -a python -m unittest discover -s tests -p "test_*.py"

      - name: Run informative V3 benchmarks
        env:
          PYTHONPATH: src:packages/workbench_ui
        run: |
          python benchmarks/benchmark_scene_sync.py --iterations 10
          python benchmarks/benchmark_v3_workflows.py --iterations 5 --curves 100

  windows-v3:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile and run V3 boundary suites
        env:
          PYTHONPATH: src;packages/workbench_ui
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q src packages/workbench_ui/workbench_ui
          python scripts/report_architecture_metrics.py --fail-on-new
          python -m unittest tests.test_task77_viewport tests.test_task78_boundaries tests.test_task79_workbench_ui tests.test_task80_v3_ui tests.test_task81_legacy_boundary tests.test_task82_release tests.test_v3_workflow_service
