name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa libxrender1 libxkbcommon-x11-0

      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Verify required geometry dependencies
        run: python -c "import tkinter; import vtkmodules"

      - name: Run accelerated mesh-query tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_mesh_spatial_index.py"

      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: xvfb-run -a python -m unittest discover -s tests -p "test_*.py"
